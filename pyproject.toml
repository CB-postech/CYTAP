[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cytap"
version = "0.1.0"
description = "CYTAP: inferring cytokine responses in single cells from adapted foundation model embeddings"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yujin L. Jeong" }, { name = "Jong Kyoung Kim" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "anndata>=0.9",
    "torch>=2.0",
    "scikit-learn>=1.1",
    "pyyaml>=6.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest", "statsmodels"]  # statsmodels: reference BH-FDR in tests/test_stats.py

[project.scripts]
cytap = "cytap.command_line:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cytap = ["LICENSE-CELLOT"]
